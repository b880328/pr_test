name: PR Test CI 

# 触发条件：当 Pull Request 被创建/更新时
on:
  pull_request:
    branches: [ main ]  # 只对 main 分支的 PR 生效

jobs:
  test:
    runs-on: ubuntu-latest  # 运行环境
    steps:
      - name: Checkout code          #获取代码
        uses: actions/checkout@v4

      - name: Setup Node.js         #设置node版本
        uses: actions/setup-node@v4
        with:
          node-version: 24  # Node 版本

      - name: Install dependencies           #安装依赖
        run: npm install

      - name: Run tests
        run: npm run build # 执行测试命令
